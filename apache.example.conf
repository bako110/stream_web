<VirtualHost *:80>
    ServerName 178.104.248.78
    DocumentRoot /var/www/stream_web/dist

    <Directory /var/www/stream_web/dist>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]

        # Assurer les bons MIME types
        AddType application/javascript .js
        AddType text/css .css
    </Directory>

    # Proxy API
    ProxyPass /api http://localhost:3000/api
    ProxyPassReverse /api http://localhost:3000/api

    # Proxy uploads
    ProxyPass /uploads http://localhost:3000/uploads
    ProxyPassReverse /uploads http://localhost:3000/uploads
</VirtualHost>
