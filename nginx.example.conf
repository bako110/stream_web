server {
    listen 80;
    server_name 178.104.248.78;

    root /var/www/stream_web/dist;
    index index.html;

    # Routes OG — proxiées vers le backend pour les bots (WhatsApp, Telegram…)
    # Le backend détecte le User-Agent bot et renvoie le HTML avec les meta OG.
    # Les humains sont redirigés par le backend vers la SPA.
    location ~ ^/(join|posts|events|concerts|reels|films|series|og)(/|$) {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir les fichiers statiques avec les bons MIME types
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assurer les bons MIME types pour JS et CSS
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API vers le backend
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploads
    location /uploads {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
